name: Build Murmure (AAB + APK)

# Deux types de build :
# - push sur main (et lancement manuel sans play_release) : build de DÉVELOPPEMENT, signé avec la
#   clé debug, artefact « murmure-DEBUG-non-publiable ». Les secrets de signature ne sont même pas
#   lus : la clé d'upload ne sort jamais pour un build non publié.
# - release Play : tag `v*`, ou lancement manuel avec play_release=true. La signature release est
#   alors OBLIGATOIRE (MURMURE_REQUIRE_RELEASE_SIGNING=true) : échec clair si un secret manque ou si
#   l'AAB produit est signé debug — jamais de repli silencieux.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      play_release:
        description: 'Release Google Play (signature upload obligatoire)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MURMURE_REQUIRE_RELEASE_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.play_release)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Épinglé (plutôt que "stable" flottant) : les versions de Flutter plus récentes basculent
          # par défaut sur Gradle 9, qui a supprimé des API encore utilisées par certains plugins.
          # 3.29.0 reste sur Gradle 8.x (AGP 8.7.0, voir android/settings.gradle.kts).
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Type de build
        run: |
          echo "Release Play : $MURMURE_REQUIRE_RELEASE_SIGNING (ref=$GITHUB_REF, event=$GITHUB_EVENT_NAME)"
          echo "versionCode : $((100 + GITHUB_RUN_NUMBER))"

      - name: Compiler libolm 3.2.16 (alignée 16 Ko, commit source vérifié)
        # Remplace flutter_olm 2.0.0, dont le libolm.so était aligné 4 Ko (refusé par Play). Le
        # script clone le tag officiel, ÉCHOUE si le commit diffère du hash épinglé, compile pour
        # arm64-v8a/armeabi-v7a/x86_64 avec le NDK 28.2.13676358 (installé si absent), puis vérifie
        # SONAME (libolm.so), alignement LOAD >= 0x4000 et symboles exportés de chaque .so.
        run: bash scripts/build_libolm.sh

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser (lint)
        run: flutter analyze --no-fatal-infos

      - name: Tests automatisés (logique pure, sans homeserver ni matériel Bluetooth)
        # Avant les builds de release : un test cassé bloque la publication d'un binaire défaillant.
        run: flutter test

      - name: Reconstituer le keystore de signature (release Play uniquement)
        if: env.MURMURE_REQUIRE_RELEASE_SIGNING == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          missing=""
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_PASSWORD UPLOAD_KEY_ALIAS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release Play demandée mais secret(s) GitHub manquant(s) :$missing. Ajoutez-les (Settings > Secrets and variables > Actions) puis relancez."
            exit 1
          fi
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Format .properties : `\` est un caractère d'échappement, on le double pour qu'un mot
          # de passe qui en contient soit relu à l'identique par Gradle.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf 'storePassword=%s\n' "$(esc "$UPLOAD_STORE_PASSWORD")"
            printf 'keyPassword=%s\n' "$(esc "$UPLOAD_KEY_PASSWORD")"
            printf 'keyAlias=%s\n' "$(esc "$UPLOAD_KEY_ALIAS")"
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties

      - name: Construire l'AAB (Play Store)
        run: flutter build appbundle --release --build-number=$((100 + GITHUB_RUN_NUMBER))

      - name: Vérifier la signature de l'AAB
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::AAB introuvable : $aab"; exit 1; }
          cert="$(keytool -printcert -jarfile "$aab" 2>&1 || true)"
          if echo "$cert" | grep -q 'CN=Android Debug'; then
            if [ "$MURMURE_REQUIRE_RELEASE_SIGNING" = "true" ]; then
              echo "::error::L'AAB de release Play est signé avec la clé DEBUG : refusé."
              exit 1
            fi
            echo "::warning::Build de développement signé DEBUG : NON publiable sur Google Play."
          elif [ "$MURMURE_REQUIRE_RELEASE_SIGNING" = "true" ]; then
            if ! echo "$cert" | grep -q 'Owner:'; then
              echo "::error::Impossible de lire le certificat de signature de l'AAB."
              echo "$cert"
              exit 1
            fi
            echo "AAB signé avec la clé d'upload :"
            echo "$cert" | grep -E 'Owner:|SHA256:'
          fi

      - name: Garde-fou policy Play (aucune permission d'installation dans l'AAB)
        run: |
          m=$(find build/app/intermediates -path '*release*' -not -path '*debug*' -name AndroidManifest.xml | grep -i merged | head -1)
          test -n "$m" || { echo "Manifeste fusionné release introuvable"; exit 1; }
          # Lecture XML (les commentaires du manifeste, conservés à la fusion, citent ce nom).
          python3 - "$m" <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}name'
          root = ET.parse(sys.argv[1]).getroot()
          # Permissions refusées ou soumises à déclaration spéciale par Google Play, qu'un plugin
          # pourrait ajouter par fusion sans qu'on le voie (revue croisée DeepSeek, vérifiée).
          FORBIDDEN = {'REQUEST_INSTALL_PACKAGES', 'QUERY_ALL_PACKAGES', 'MANAGE_EXTERNAL_STORAGE',
                       'ACCESS_BACKGROUND_LOCATION', 'READ_SMS', 'SEND_SMS', 'RECEIVE_SMS',
                       'READ_CALL_LOG', 'WRITE_CALL_LOG', 'PROCESS_OUTGOING_CALLS', 'READ_CONTACTS',
                       'READ_MEDIA_IMAGES', 'READ_MEDIA_VIDEO', 'SYSTEM_ALERT_WINDOW',
                       'BIND_ACCESSIBILITY_SERVICE', 'USE_FULL_SCREEN_INTENT'}
          bad = sorted({e.get(A).rsplit('.', 1)[-1] for e in root.iter()
                        if e.tag in ('uses-permission', 'uses-permission-sdk-23')
                        and (e.get(A) or '').rsplit('.', 1)[-1] in FORBIDDEN})
          if bad:
              sys.exit('Permissions interdites/sensibles dans la version Play : ' + ', '.join(bad))
          PY
          echo "OK : $m sans permission interdite"

      - name: Construire l'APK universel (installation manuelle sur tablette de test)
        run: flutter build apk --release --build-number=$((100 + GITHUB_RUN_NUMBER))

      - name: Vérifier la présence de libolm.so (AAB et APK, 3 ABI)
        # Sans libolm.so, package:olm ne peut pas s'initialiser et l'appli refuse de démarrer :
        # ÉCHEC pour tout build (développement comme release), jamais un simple avertissement.
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab_list="$(unzip -Z1 "$aab")"
          apk_list="$(unzip -Z1 "$apk")"
          missing=""
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -qx "base/lib/$abi/libolm.so" <<<"$aab_list" || missing="$missing AAB:$abi"
            grep -qx "lib/$abi/libolm.so" <<<"$apk_list" || missing="$missing APK:$abi"
          done
          if [ -n "$missing" ]; then
            echo "::error::libolm.so absente :$missing (voir l'étape « Compiler libolm »)."
            exit 1
          fi
          echo "OK : libolm.so présente pour arm64-v8a, armeabi-v7a, x86_64 dans l'AAB et l'APK."

      - name: Vérifier l'alignement 16 Ko des bibliothèques natives (arm64-v8a, x86_64)
        # Google Play exige des .so alignés sur des pages de 16 Ko (Android 15+). ÉCHEC pour une
        # release Play, simple avertissement pour un build de développement. libolm.so (compilée
        # par scripts/build_libolm.sh avec -z max-page-size=16384) doit désormais passer.
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk" || { echo "::error::APK introuvable : $apk"; exit 1; }
          work="$(mktemp -d)"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d "$work" || true
          bad=0; total=0
          while IFS= read -r -d '' so; do
            total=$((total + 1))
            # Colonne « Align » de chaque segment LOAD ; 16 Ko = 0x4000 (2**14).
            for a in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((a)) -lt 16384 ]; then
                echo "Non aligné 16 Ko : ${so#"$work"/} (LOAD align $a)"
                bad=$((bad + 1))
                break
              fi
            done
          done < <(find "$work/lib" -name '*.so' -print0 2>/dev/null)
          rm -rf "$work"
          echo "$total bibliothèque(s) vérifiée(s), $bad non alignée(s)."
          if [ "$total" -eq 0 ]; then
            echo "::warning::Aucune .so arm64-v8a/x86_64 trouvée dans l'APK."
          elif [ "$bad" -gt 0 ]; then
            if [ "$MURMURE_REQUIRE_RELEASE_SIGNING" = "true" ]; then
              echo "::error::$bad bibliothèque(s) native(s) non alignée(s) sur 16 Ko : refusé pour Google Play."
              exit 1
            fi
            echo "::warning::$bad bibliothèque(s) native(s) non alignée(s) sur 16 Ko (bloquant pour une release Play)."
          fi

      - name: Nettoyer les secrets du disque
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks

      - name: Publier l'artefact (release Play)
        if: env.MURMURE_REQUIRE_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: murmure-release-play
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publier l'artefact (développement, signé debug)
        if: env.MURMURE_REQUIRE_RELEASE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: murmure-DEBUG-non-publiable
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
