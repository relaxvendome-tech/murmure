name: Build Murmure (AAB + APK)

# Se déclenche sur chaque push vers main, et manuellement. Les secrets de signature ne transitent
# jamais par du texte en clair dans les logs : ils sont écrits dans des fichiers temporaires que
# GitHub masque automatiquement, et supprimés en fin de job.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Épinglé (plutôt que "stable" flottant) : les versions de Flutter plus récentes que
          # celle-ci basculent par défaut sur Gradle 9, qui a supprimé l'API `Project.exec()`
          # dont dépend encore le script Gradle de cargokit (utilisé par flutter_vodozemac pour
          # compiler sa partie Rust/vodozemac) — voir l'échec du run avec Flutter 3.47.9. 3.29.0
          # reste sur Gradle 8.x par défaut tout en embarquant un Dart assez récent pour
          # flutter_vodozemac (qui exige Dart >=3.6.2).
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser (lint)
        run: flutter analyze --no-fatal-infos

      - name: Tests automatisés (logique pure, sans homeserver ni matériel Bluetooth)
        # Trouvé en audit interne : zéro test automatisé n'existait avant ce commit (CI ne
        # vérifiait que la compilation et le lint, jamais le comportement). Place avant les builds
        # de release pour qu'un test cassé bloque la publication d'un binaire défaillant plutôt que
        # d'être découvert après coup. Volontairement limité pour l'instant au code pur et
        # déterministe (cliquet cryptographique du mesh, dépouillement EXIF) qui ne demande rien de
        # plus que ce que ce runner fournit déjà ; les tests d'intégration (Matrix, BLE réel)
        # demanderaient une infrastructure encore absente de ce pipeline (serveur Synapse/Dendrite,
        # matériel ou émulation Bluetooth), volontairement pas abordés dans ce commit.
        run: flutter test

      - name: Reconstituer le keystore de signature
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Pas de secret de signature configuré : build non signé (debug). Voir README."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_STORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Construire l'AAB (Play Store)
        run: flutter build appbundle --release

      - name: Garde-fou policy Play (aucune permission d'installation dans l'AAB)
        run: |
          m=$(find build/app/intermediates -path '*release*' -not -path '*debug*' -name AndroidManifest.xml | grep -i merged | head -1)
          test -n "$m" || { echo "Manifeste fusionné release introuvable"; exit 1; }
          # Lecture XML (les commentaires du manifeste, conservés à la fusion, citent ce nom).
          python3 - "$m" <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}name'
          root = ET.parse(sys.argv[1]).getroot()
          bad = [e.get(A) for e in root.iter() if e.tag in ('uses-permission', 'uses-permission-sdk-23')
                 and e.get(A) == 'android.permission.REQUEST_INSTALL_PACKAGES']
          if bad:
              sys.exit('REQUEST_INSTALL_PACKAGES présente dans la version Play : refusé.')
          PY
          echo "OK : $m sans REQUEST_INSTALL_PACKAGES"

      - name: Construire l'APK universel (installation manuelle sur tablette de test)
        run: flutter build apk --release

      - name: Nettoyer les secrets du disque
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: murmure-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
