# === Serveur TURN (coturn) — relais média pour les appels Murmure ===
#
# Corrige une proposition reçue dans cette conversation qui, mal relue, aurait rendu les appels
# non fonctionnels : `no-udp-relay` interdit au serveur d'allouer un relais UDP vers le correspondant,
# ce qui est précisément ce dont un appel WebRTC a besoin pour transporter l'audio/vidéo. Ce que ce
# fichier interdit, c'est le contrôle CLIENT → TURN en clair (UDP/TCP non chiffrés) : l'entrée du
# client se fait UNIQUEMENT via `tls-listening-port` (TURNS, chiffré). Le relais lui-même, côté
# "correspondant", reste autorisé à parler UDP — sinon aucun appel ne peut jamais s'établir.
#
# Voir docs/CALLS_ARCHITECTURE.md pour pourquoi ceci ne protège le flux média que lorsque
# l'application force `iceTransportPolicy: 'relay'` ET ne configure aucun serveur STUN : ce fichier
# seul ne suffit pas, c'est la combinaison des deux côtés qui compte.

# Port du port d'écoute TURNS (chiffré). Voir le README de ce dossier pour le conflit avec Caddy
# (qui écoute déjà le 443 pour Conduit) et comment le résoudre dans VOTRE déploiement avant de
# lancer ce service — ne pas démarrer les deux sur le même port sans l'avoir réglé.
tls-listening-port=5349

# Désactive les entrées client NON chiffrées : tout client doit obligatoirement passer par TURNS
# (port ci-dessus). N'affecte PAS la capacité de relais (voir note en tête de fichier).
no-udp
no-tcp

# Certificat TLS : celui que Caddy obtient déjà pour le domaine (volume `caddy-data`, monté en
# LECTURE SEULE dans le conteneur coturn sous /caddy-data, voir docker-compose.yml). Ces deux
# lignes sont réécrites par deploy.sh avec le chemin réel (l'émetteur ACME — Let's Encrypt ou
# ZeroSSL — fait partie du chemin). En configuration manuelle : remplacez CHANGEME par votre
# domaine et vérifiez le dossier de l'émetteur avec
#   docker compose exec caddy find /data/caddy/certificates -name '*.crt'
cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/CHANGEME.exemple.fr/CHANGEME.exemple.fr.crt
pkey=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/CHANGEME.exemple.fr/CHANGEME.exemple.fr.key
no-tlsv1
no-tlsv1_1

# Authentification à identifiants temporaires (secret partagé avec Conduit, voir conduit.toml :
# turn_secret). Jamais d'identifiant statique codé en dur côté client — chaque appel récupère des
# identifiants valables `turn_ttl` secondes via GET /_matrix/client/v3/voip/turnServer.
use-auth-secret
static-auth-secret=CHANGEME_meme_secret_que_turn_secret_dans_conduit_toml
realm=CHANGEME.exemple.fr

# Plage de ports pour les allocations de relais (UDP, vers le correspondant). À ouvrir dans le
# pare-feu ; voir le README pour pourquoi ce service tourne en `network_mode: host` dans
# docker-compose.yml (le NAT du réseau Docker casserait l'adresse de relais annoncée aux pairs).
min-port=49152
max-port=65535

# Durcissement : empêche le serveur de relayer vers des adresses privées/locales — sans ceci, un
# TURN ouvert peut servir à sonder ou attaquer le réseau interne de l'hébergeur depuis l'extérieur
# (abus classique d'un relais mal restreint, indépendant de Murmure mais à ne jamais omettre).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Plages de documentation (RFC 5737 / RFC 3849) et 240.0.0.0/4 réservé (+ broadcast) : jamais un
# pair légitime.
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
# Contournements IPv6 des règles IPv4 ci-dessus : adresses IPv4-mapped (::ffff:a.b.c.d) et
# préfixes NAT64 (64:ff9b::/96 bien connu, 64:ff9b:1::/48 local) qui encapsulent une IPv4
# arbitraire — y compris privée ou loopback.
denied-peer-ip=::
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
# Multicast (224.0.0.0/4, ff00::/8) : jamais relayé.
no-multicast-peers

# Désactive l'interface d'administration CLI (telnet) de coturn : surface d'attaque inutile ici,
# rien dans Murmure n'a besoin de s'y connecter.
no-cli

# Pas de quotas de bande passante/sessions par défaut (usage anonyme, pas de notion de compte TURN
# individuel à limiter) — à ajuster si l'abus devient un problème réel en pratique.
total-quota=0
user-quota=0

# AUCUN journal : coturn écrit sinon l'adresse IP de chaque client et de chaque pair relayé —
# exactement la métadonnée (qui appelle qui, depuis où) que le relais TURN existe pour cacher, et
# qu'une saisie du serveur révélerait. `simple-log` est indispensable : sans lui, coturn ajoute
# une date au nom du fichier (/dev/null-AAAA-MM-JJ.log), ce qui recréerait un vrai fichier.
no-stdout-log
simple-log
log-file=/dev/null

# Le conteneur démarre en root (seul moyen de lire la clé privée du certificat, écrite en 0600 par
# Caddy), puis coturn abandonne ses privilèges une fois le certificat chargé et les ports ouverts.
proc-user=nobody
proc-group=nogroup
