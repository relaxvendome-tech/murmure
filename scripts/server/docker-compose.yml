version: "3.8"

# Serveur Murmure : Conduit (implémentation légère du protocole Matrix, en Rust) derrière Caddy
# (HTTPS automatique via Let's Encrypt). Aucune donnée de message n'est lisible par le serveur :
# Conduit stocke des événements déjà chiffrés de bout en bout (Olm/Megolm) par les téléphones.
# Ce que le serveur héberge reste : métadonnées de routage (qui parle à qui, quand — inévitable
# avec Matrix fédéré), et la liste des comptes. Les réglages ci-dessous minimisent ce qui est
# gardé au-delà du strict nécessaire au fonctionnement.

services:
  conduit:
    # Épinglé sur une version précise (v0.10.13, stable au moment de cette revue) plutôt que
    # `:latest` : un tag flottant peut changer de contenu à votre insu entre deux `docker compose
    # pull` — ni reproductible, ni auditable, et une image modifiée en amont (compromission du
    # registre, erreur de publication) serait tirée automatiquement sans que vous ne le sachiez.
    # Pour vérifier vous-même avant de déployer :
    #   docker pull matrixconduit/matrix-conduit:v0.10.13
    #   docker inspect --format '{{index .RepoDigests 0}}' matrixconduit/matrix-conduit:v0.10.13
    # Montez en version délibérément (en relisant le changelog du projet), jamais par un `pull`
    # automatique sur `latest`.
    image: matrixconduit/matrix-conduit:v0.10.13
    restart: unless-stopped
    volumes:
      - conduit-data:/var/lib/matrix-conduit
      - ./conduit.toml:/etc/matrix-conduit/conduit.toml:ro
    environment:
      CONDUIT_CONFIG: /etc/matrix-conduit/conduit.toml
    expose:
      - "6167"
    networks: [murmure]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [conduit]
    networks: [murmure]

networks:
  murmure:

volumes:
  conduit-data:
  caddy-data:
  caddy-config:
