version: "3.8"

# Serveur Murmure : Conduit (implémentation légère du protocole Matrix, en Rust) derrière Caddy
# (HTTPS automatique via Let's Encrypt). Aucune donnée de message n'est lisible par le serveur :
# Conduit stocke des événements déjà chiffrés de bout en bout (Olm/Megolm) par les téléphones.
# Ce que le serveur héberge reste : métadonnées de routage (qui parle à qui, quand — inévitable
# avec Matrix fédéré), et la liste des comptes. Les réglages ci-dessous minimisent ce qui est
# gardé au-delà du strict nécessaire au fonctionnement.

services:
  conduit:
    # Épinglé sur une version précise (v0.10.13, stable au moment de cette revue) plutôt que
    # `:latest` : un tag flottant peut changer de contenu à votre insu entre deux `docker compose
    # pull` — ni reproductible, ni auditable, et une image modifiée en amont (compromission du
    # registre, erreur de publication) serait tirée automatiquement sans que vous ne le sachiez.
    # Pour vérifier vous-même avant de déployer :
    #   docker pull matrixconduit/matrix-conduit:v0.10.13
    #   docker inspect --format '{{index .RepoDigests 0}}' matrixconduit/matrix-conduit:v0.10.13
    # Montez en version délibérément (en relisant le changelog du projet), jamais par un `pull`
    # automatique sur `latest`.
    image: matrixconduit/matrix-conduit:v0.10.13
    restart: unless-stopped
    volumes:
      - conduit-data:/var/lib/matrix-conduit
      - ./conduit.toml:/etc/matrix-conduit/conduit.toml:ro
    environment:
      CONDUIT_CONFIG: /etc/matrix-conduit/conduit.toml
    expose:
      - "6167"
    networks: [murmure]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [conduit]
    networks: [murmure]

  # Serveur TURN (relais média des appels, voir docs/CALLS_ARCHITECTURE.md). Facultatif : à ne
  # démarrer que si vous avez lu scripts/server/coturn/README.md, en particulier le conflit avec
  # Caddy sur le port 443 (coturn écoute 5349 par défaut dans ce dépôt, voir ce README pour
  # pourquoi et les options si vous voulez malgré tout du 443).
  #
  # `network_mode: host` plutôt qu'un réseau Docker : coturn annonce aux appelants l'adresse IP à
  # laquelle les joindre pour le relais, et le NAT du réseau "murmure" ci-dessus la fausserait
  # (les candidats ICE pointeraient vers une IP interne au conteneur, injoignable depuis
  # l'extérieur) — c'est un besoin documenté de coturn, pas une négligence de ce fichier. Ouvrez en
  # conséquence tls-listening-port (5349) et la plage min-port..max-port du fichier de
  # configuration dans le pare-feu de la machine elle-même (plus de mapping de ports Docker ici).
    # Épinglé pour la même raison que l'image Conduit ci-dessus (reproductibilité/audit) — mais
    # VÉRIFIEZ ce numéro avant de déployer, je ne l'ai pas tiré moi-même dans ce bac à sable :
    #   docker pull coturn/coturn:4.18.0-alpine
    #   docker inspect --format '{{index .RepoDigests 0}}' coturn/coturn:4.18.0-alpine
  coturn:
    image: coturn/coturn:4.18.0-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

networks:
  murmure:

volumes:
  conduit-data:
  caddy-data:
  caddy-config:
