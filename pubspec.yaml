name: murmure
description: Messagerie chiffrée de bout en bout, sans numéro de téléphone.
publish_to: 'none'
version: 3.0.0+7

environment:
  sdk: '>=3.6.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  matrix: ^0.29.0
  flutter_vodozemac: ^0.5.0
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  cryptography: ^2.6.1
  flutter_zxing: ^2.2.1
  image_picker: ^1.1.2
  video_player: ^2.9.1
  intl: ^0.19.0
  flutter_blue_plus: ^1.36.0
  permission_handler: ^11.3.1
  socks5_proxy: ^2.1.1
  # Déjà utilisé en transitif par network.dart (via `matrix`) avant cette revue, mais jamais
  # déclaré en direct : on le fixe explicitement puisqu'on en étend l'usage (SOCKS5 réel) et qu'on
  # ne veut pas dépendre silencieusement d'une version choisie par un autre paquet.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
