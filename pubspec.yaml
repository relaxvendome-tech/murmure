name: murmure
description: Messagerie chiffrée de bout en bout, sans numéro de téléphone.
publish_to: 'none'
version: 3.0.0+7

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # matrix-dart-sdk >= 1.0.0 chiffre TOUT (Olm/Megolm, SAS, sauvegarde de clés, pièces jointes)
  # via vodozemac (implémentation Rust de Matrix.org, auditée par Least Authority), par le paquet
  # Dart `vodozemac` qu'il importe lui-même. libolm (dépréciée en amont) n'est plus utilisée nulle
  # part : `olm`, scripts/build_libolm.sh et les jniLibs ont été retirés.
  # matrix 16 exige Dart >= 3.11 (Flutter 3.41.x épinglé dans .github/workflows/build.yml).
  matrix: ^16.0.2
  # Bibliothèque native de vodozemac pour Android (plugin FFI) : cargokit compile la crate Rust
  # au build Gradle (rustup requis, voir build.yml) et la lie avec -z max-page-size=16384
  # (pages de 16 Ko, exigence Play). `vod.init()` DOIT réussir avant `Client.init()` : sinon le
  # SDK démarre SANS chiffrement (`client.encryptionEnabled == false`) et l'appli refuse alors de
  # démarrer/s'inscrire (voir lib/main.dart et Account.register).
  flutter_vodozemac: ^0.9.0
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  # Déverrouillage biométrique optionnel (voir lib/biometric.dart) ; l'UI seulement, jamais les clés.
  local_auth: ^2.3.0
  local_auth_android: ^1.0.0 # AndroidAuthMessages (non réexporté par local_auth 2.x)
  path_provider: ^2.1.3
  path: ^1.9.0
  cryptography: ^2.6.1
  flutter_zxing: ^2.2.1
  intl: ^0.19.0
  flutter_blue_plus: ^1.36.0
  permission_handler: ^11.3.1
  socks5_proxy: ^2.1.1
  # Déjà utilisé en transitif par network.dart (via `matrix`) avant cette revue, mais jamais
  # déclaré en direct : on le fixe explicitement puisqu'on en étend l'usage (SOCKS5 réel) et qu'on
  # ne veut pas dépendre silencieusement d'une version choisie par un autre paquet.
  http: ^1.2.0
  # Appels (voir lib/calls/ et docs/CALLS_ARCHITECTURE.md) : gère ses propres sockets natifs, EN
  # DEHORS du http.Client de network.dart — c'est précisément pour ça que CallPolicy impose
  # iceTransportPolicy 'relay' et zéro STUN plutôt que de compter sur le correctif Tor/SOCKS5, qui
  # ne protège que le trafic HTTP (voir docs/CALLS_ARCHITECTURE.md). Version non vérifiée par un
  # `flutter pub get` dans ce bac à sable — à confirmer par la CI de ce commit.
  flutter_webrtc: ^1.6.3
  # Déjà utilisé en transitif par flutter_webrtc (couche d'abstraction commune à ses
  # implémentations par plateforme) et par matrix-dart-sdk (type de retour de
  # WebRTCDelegate.mediaDevices) : déclaré en direct pour la même raison que `http` ci-dessus —
  # lib/calls/services/call_manager.dart importe directement son type MediaDevices.
  webrtc_interface: ^1.5.1
  # Notification d'appel manqué (voir lib/calls/services/call_opsec_notifier.dart) : nécessaire
  # pour afficher quoi que ce soit dans la barre d'état Android en dehors de l'appli elle-même.
  flutter_local_notifications: ^18.0.1
  # Envoi de photos (voir lib/media.dart et ChatScreen._pickAndSendImage). pub.dev donnait 1.2.4
  # comme dernière version au moment de cet ajout, mais la CI (seul endroit de ce bac à sable où
  # `flutter pub get` tourne réellement) a rejeté cette contrainte : image_picker >=1.2.2 exige
  # Dart SDK >=3.9.0, alors que Flutter est épinglé à 3.29.0 dans ce dépôt (Dart 3.7.0 résolu par
  # la CI elle-même, voir le run qui a précédé ce correctif) — écart entre ce que documente pub.dev
  # et ce que permet la version de Flutter réellement utilisée ici, pas une erreur de frappe.
  # Rabaissé à la suggestion donnée par `flutter pub get` dans ce même run CI. Sélecteur système
  # uniquement (galerie), jamais de caméra directe dans cette passe pour limiter la surface de
  # permissions ajoutée d'un coup.
  image_picker: ^1.2.1
  # Déjà utilisé en transitif par `matrix` (génération de vignettes), déclaré en direct ici car
  # lib/media.dart l'importe maintenant explicitement pour dépouiller les EXIF (GPS, horodatage
  # précis, modèle d'appareil) avant tout chiffrement/envoi — voir le threat model documenté en
  # tête de ce fichier. Version alignée sur celle déjà résolue par matrix-dart-sdk (`image: ^4.0.15`, inchangée
  # de 0.29.x à 16.0.2, vérifiée dans son pubspec.yaml), pour ne pas introduire de contrainte de version concurrente.
  image: ^4.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
