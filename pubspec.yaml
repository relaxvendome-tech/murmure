name: murmure
description: Messagerie chiffrée de bout en bout, sans numéro de téléphone.
publish_to: 'none'
version: 3.0.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  matrix: ^0.29.0
  flutter_vodozemac: ^0.5.0
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0
  cryptography: ^2.6.1
  flutter_zxing: ^2.2.1
  image_picker: ^1.1.2
  light_compressor: ^2.2.0
  video_player: ^2.9.1
  intl: ^0.19.0
  flutter_blue_plus: ^1.36.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
